# Nightly: main CI's already-tested installers (artifacts package-*) as a signed prerelease
# vX.Y.Z-nightly.YYYYMMDD.N, with no rebuild. Skipped when main hasn't changed or its CI isn't green.
name: Nightly
on:
  schedule: [{ cron: "11 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(python3 scripts/check-version.py)" >> "$GITHUB_OUTPUT"
  nightly:
    needs: version
    uses: qa-p1/Arcade-Link/.github/workflows/app-nightly.yml@v1.1.1
    with:
      app: arcade.find
      version: ${{ needs.version.outputs.version }}
      artifacts: package-*
      windows-installer: inno
      link-ref: v1.1.1
    secrets:
      ARCADE_UPDATE_SIGNING_KEY: ${{ secrets.ARCADE_UPDATE_SIGNING_KEY }}
