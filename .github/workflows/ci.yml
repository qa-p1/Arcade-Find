# Checks, tests, end-to-end runs and package builds. Packages are workflow
# artifacts; a version tag (v<Cargo version>) also publishes them, with
# arcade-release.json and checksums, as a GitHub release Arcade Tools installs.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  settings-ui:
    name: Settings screenshots (real eframe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Remove the runner's incomplete pinned toolchain
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb xdotool x11-utils imagemagick dbus
      - name: Build Find and the pinned isolation runner
        run: |
          cargo build --locked -p arcade-find --bin arcade-find
          git clone --depth 1 --branch v0.4.11 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
      - name: Capture settings matrix
        run: python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- python3 scripts/check-settings-ui.py target/debug/arcade-find
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: settings-screenshots
          path: target/e2e/settings

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Remove incomplete pinned toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev
      - name: Source, lint, documentation, design and isolated tests
        timeout-minutes: 15
        shell: bash
        run: python3 scripts/check.py --core-only

  e2e-linux:
    name: end-to-end (headless sway + Xvfb)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Remove incomplete pinned toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Session tools
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev sway grim wtype xvfb xdotool xclip x11-utils imagemagick libvips-tools dbus python3-dbus python3-gi python3-pyatspi at-spi2-core ripgrep fonts-noto-cjk libopengl0 libegl1 libgl1 libgl1-mesa-dri libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 libxcb-xkb1 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3
      - name: Build the old backend for the lifecycle regression
        run: |
          git fetch --depth 1 origin 041ccef4794ac3c5c9f54b8e901239df6fd4e786
          git worktree add --detach "$RUNNER_TEMP/before-wayland" 041ccef4794ac3c5c9f54b8e901239df6fd4e786
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --manifest-path "$RUNNER_TEMP/before-wayland/Cargo.toml" -p arcade-find --bin arcade-find
          cp target/debug/arcade-find "$RUNNER_TEMP/old-wayland-find"
          echo "ARCADE_FIND_OLD_WAYLAND_BIN=$RUNNER_TEMP/old-wayland-find" >> "$GITHUB_ENV"
      - name: Build Find and the pinned Link CLI
        run: |
          cargo build --locked -p arcade-find --bin arcade-find --example e2e-pointer
          git -c advice.detachedHead=false clone -q --depth 1 --branch v0.4.11 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          cargo build --locked --manifest-path "$RUNNER_TEMP/link/Cargo.toml" -p arcade-link-cli
          echo "ARCADE_LINK_DIR=$RUNNER_TEMP/link" >> "$GITHUB_ENV"
          echo "ARCADE_LINK_CLI=$RUNNER_TEMP/link/target/debug/arcade-link" >> "$GITHUB_ENV"
      - name: Download and verify the real released Shelf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-peer.py qa-p1/Arcade-Shelf "$RUNNER_TEMP/real-shelf"
          echo "ARCADE_SHELF_BIN=$RUNNER_TEMP/real-shelf/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Download and verify the real released Look and Box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-peer.py qa-p1/Arcade-look "$RUNNER_TEMP/real-look" v0.4.0
          python3 scripts/fetch-peer.py qa-p1/Arcade-box "$RUNNER_TEMP/real-box" v0.4.0
          echo "ARCADE_LOOK_BIN=$RUNNER_TEMP/real-look/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "ARCADE_BOX_BIN=$RUNNER_TEMP/real-box/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Native lifecycle, real tray, layer-shell, fallback and real Shelf drag checks
        timeout-minutes: 20
        run: python3 scripts/check.py --native-only --binary target/debug/arcade-find
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots
          path: target/e2e

  package:
    name: package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-2022 }
          - { name: macos-universal, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Remove incomplete pinned toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain uninstall 1.88.0 || true
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev desktop-file-utils xvfb xdotool dbus
      - name: Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation did not complete' }
      - name: Build installers
        shell: bash
        run: python3 scripts/package.py
      - name: AppImage install, repair and uninstall (isolated)
        if: runner.os == 'Linux'
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch v0.4.11 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- python3 scripts/verify-appimage.py dist/Arcade-Find-x86_64.AppImage
      - name: Upgrade the real previous AppImage without losing user state
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-peer.py qa-p1/Arcade-Find "$RUNNER_TEMP/previous-find" v0.4.3
          previous=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["file"])' "$RUNNER_TEMP/previous-find/source.json")
          python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- python3 scripts/check-upgrade.py "$RUNNER_TEMP/previous-find/$previous" dist/Arcade-Find-x86_64.AppImage
      - name: Preserve upgrade verification evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: previous-release-upgrade
          path: target/e2e/upgrade
      - name: Windows silent install/uninstall (CI account only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/verify.ps1
      - name: DMG install (CI account only)
        if: runner.os == 'macOS'
        run: |
          v=$(python3 scripts/check-version.py)
          packaging/macos/verify.sh "dist/Arcade-Find-$v-universal.dmg"
          rm -rf "dist/Arcade Find.app"
      - name: Smoke test
        shell: bash
        run: |
          target/release/arcade-find --version
          target/release/arcade-find --arcade-manifest | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["id"]=="arcade.find" and any(a["id"]=="find.search" for a in m["actions"])'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*

  release-manifest:
    name: arcade-release.json
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Release manifest and checksums
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 tools/arcade-release.py --id arcade.find --version "$v" --channel stable \
            --notes "https://github.com/qa-p1/Arcade-Find/blob/${GITHUB_SHA}/CHANGELOG.md" --windows-installer inno dist
          python3 -c 'import json; m=json.load(open("dist/arcade-release.json")); assert all(a["installArgs"] == ["--install", "--silent"] for a in m["assets"] if a["kind"] == "appimage")'
          cat dist/arcade-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: |
            dist/arcade-release.json
            dist/SHA256SUMS.txt

  publish:
    name: publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-manifest, e2e-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          python3 tools/release-notes.py CHANGELOG.md "$v" > notes.md
          printf '\nUser guide: https://github.com/qa-p1/Arcade-Find/tree/main/docs/user\n' >> notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.exe dist/*.dmg dist/arcade-release.json dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Arcade Find $v" --notes-file notes.md
