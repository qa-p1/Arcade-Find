name: Gates

# PLAN "Release" step 2: every exit gate against the published files of a release candidate, never a local build.
# Run it on the rc tag ("Use workflow from: v1.0.0-rc.N") once "Release" has published it; "Promote" only after a
# green run on the rc it promotes (docs/v1/DECISIONS.md D17). The shared gates (published files and manifest,
# conformance, N-1, budgets, the delta through Tools' updater, Windows and macOS smoke) are Link's app-gates.yml;
# Find adds its own Linux checks on the published AppImage and the desktop suites.
on:
  workflow_dispatch:
    inputs:
      previous:
        description: The previous stable release (upgrade test, and the delta "from the previous release")
        default: v0.5.4

permissions:
  contents: read

concurrency:
  group: find-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: qa-p1/Arcade-Link/.github/workflows/app-gates.yml@v1.0.15
    with:
      app: arcade.find
      name: find
      previous: ${{ inputs.previous }}
      link-ref: v1.0.15
      linux-packages: libxkbcommon-x11-0 libwayland-client0 python3-dbus
      # The packaged install/repair/uninstall smoke, the upgrade with a user's data from the previous release and
      # from 0.4.3 (whose folders are migrated), and the tray's lifecycle, all in Link's isolated runner.
      linux-checks: |
        e2e() { python3 ../Arcade-Link/tools/e2e.py run -- "$@"; }
        e2e python3 scripts/verify-appimage.py "$RC"
        e2e python3 scripts/check-upgrade.py "$PREVIOUS" "$RC"
        python3 scripts/fetch-peer.py qa-p1/Arcade-Find "$RUNNER_TEMP/find-0.4.3" v0.4.3
        old=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["file"])' "$RUNNER_TEMP/find-0.4.3/source.json")
        e2e python3 scripts/check-upgrade.py "$RUNNER_TEMP/find-0.4.3/$old" "$RC"
        e2e /usr/bin/python3 tests/tray-registration.py "$RC" "$(command -v arcade-link)" find
      windows-check: mkdir -p dist && cp rc/*-setup.exe dist/ && pwsh -NoProfile -File packaging/windows/verify.ps1
      macos-check: packaging/macos/verify.sh rc/*.dmg

  # Tier 1 (headless Hyprland) blocks on any failure; Tier 2 (sway, KWin, Mutter, X11) on a crash or data loss.
  desktop:
    needs: gates
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-e2e.yml@v1.0.15
    with:
      name: find
      test: tests/desktop/find_desktop.py
      args: '"$APP"'
      artifact: gate-appimage
      link-ref: v1.0.15
  desktop-tier2:
    needs: gates
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-tier2.yml@v1.0.15
    with:
      artifact: gate-appimage
      link-ref: v1.0.15
